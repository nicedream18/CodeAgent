[project]
name = "mokioclaw"
version = "0.2.0"
description = "A teaching-first mini CodeAgent built from ToolCall to Claw."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.15",
    "langchain-openai>=1.1.13",
    "langgraph>=1.1.6",
    "mcp>=2.3.0,<3",
    "pillow>=11.0.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.1.1",
    "tavily-python>=0.7.24",
    "textual>=8.2.4",
    "typer>=0.16.0",
    "pathspec>=1.1.1",
    "tiktoken>=0.12.0",
]

[project.scripts]
mokioclaw = "mokioclaw.cli.app:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_ros"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/mokioclaw/cli/app.py" = ["B008"]  # Typer declarative option defaults

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
files = ["scripts/job_readiness_trials.py", "scripts/report_job_readiness.py", "src/mokioclaw/core/completion_budget.py", "src/mokioclaw/providers/token_estimate.py", "src/mokioclaw/evaluation", "src/mokioclaw/core/execution_backend.py", "src/mokioclaw/core/approval.py", "src/mokioclaw/core/protocol", "src/mokioclaw/providers/generation.py", "src/mokioclaw/providers/usage.py", "src/mokioclaw/providers/payload_trace.py", "src/mokioclaw/core/approval_rules.py", "src/mokioclaw/core/agent_profiles.py", "src/mokioclaw/core/tool_loop.py", "src/mokioclaw/core/transport_trace.py"]
